services:
  postgres:
    image: postgres:15
    container_name: cookbook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5433"
    volumes:
      - cookbook_data:/var/lib/postgresql/data

  backend:
    container_name: cookbook_backend
    build:
      context: ../../backend
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
      - ../../backend:/app
      - /app/node_modules
    depends_on:
      - postgres

  frontend:
    container_name: cookbook_frontend
    build:
      context: ../../frontend
      target: development
    restart: unless-stopped
    environment:
      VITE_BASE_URL: ${BACKEND_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: cookbook_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres

volumes:
  cookbook_data:
