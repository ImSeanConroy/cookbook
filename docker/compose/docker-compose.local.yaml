services:
  backend:
    container_name: cookbook_backend
    build:
      context: ../../backend
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      READ_ONLY: ${READ_ONLY}
      LOG_LEVEL: ${LOG_LEVEL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
      - ../../backend:/app
      - /app/node_modules
    networks:
      - shared_network

  frontend:
    container_name: cookbook_frontend
    build:
      context: ../../frontend
      target: development
    restart: unless-stopped
    environment:
      VITE_BASE_URL: ${BACKEND_URL}
      VITE_READ_ONLY: ${READ_ONLY}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - shared_network

networks:
  shared_network:
    external: true